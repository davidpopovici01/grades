# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!portal-web/dist/**"
    - "!portal-web/package-lock.json"
    - "!dist/**"
    - "!**/*.bak"

chat:
  auto_reply: true
