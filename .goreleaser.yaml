version: 2

project_name: grades

before:
  hooks:
    - go test ./cmd/... ./internal/... .

builds:
  - id: grades
    main: ./main.go
    binary: grades
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/davidpopovici01/grades/cmd.Version={{ .Version }}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

  - id: portal
    main: ./cmd/portal
    binary: portal
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/davidpopovici01/grades/internal/portalserver.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: default
    ids:
      - grades
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  # The portal server plus the built frontend, laid out like the deploy
  # target: the binary next to a static/ directory.
  - id: portal
    ids:
      - portal
    name_template: >-
      {{ .ProjectName }}-portal_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    files:
      - src: portal-web/dist/**
        dst: static
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git

release:
  draft: false
  prerelease: auto
